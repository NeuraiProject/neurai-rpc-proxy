<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="neurai-rpc-proxy — approved HTTP RPC access between a web application and a Neurai node, including client-encrypted DePIN messages">
  <!--
    Banner v2 — deliberately flat so it renders consistently in GitHub, npm and
    documentation previews. Palette follows the Neurai light-mode tokens:
      canvas #f4f4f6 · surface #ffffff · border #e5e7eb · ink #111827
      muted #6b7280 · orange #f97316 · orange dark #ea6c10
      orange surface #fff7ed · orange border #fed7aa
    Text always sits on a solid surface or a high-contrast badge; no label relies
    on the page background or on a connector line for legibility.
  -->
  <rect width="1000" height="500" rx="20" fill="#f4f4f6"/>
  <rect x="0.5" y="0.5" width="999" height="499" rx="19.5" fill="none" stroke="#e5e7eb"/>

  <!-- Header surface -->
  <rect x="60" y="42" width="880" height="156" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="84" y="67" width="196" height="28" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <circle cx="104" cy="81" r="5" fill="#f97316"/>
  <text x="119" y="85" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.15" fill="#ea6c10">NEURAI RPC ACCESS</text>
  <text x="84" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" letter-spacing="-1.2" fill="#111827">neurai-rpc-proxy</text>
  <text x="84" y="168" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#6b7280">An approved HTTP gateway to your Neurai node</text>

  <!-- A single product promise: the one supported endpoint also carries DePIN. -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="590" y="66" width="1" height="108" fill="#e5e7eb"/>
    <rect x="620" y="72" width="151" height="25" rx="12.5" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="695.5" y="88.5" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".7" fill="#ea6c10">ONE APPROVED GATEWAY</text>
    <text x="620" y="126" font-size="20" font-weight="700" fill="#111827">One HTTP gateway</text>
    <text x="620" y="150" font-size="14" fill="#6b7280">for Neurai RPC and encrypted DePIN messages</text>
    <rect x="620" y="160" width="103" height="25" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="671.5" y="177.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#ea6c10">POST /rpc</text>
    <path d="M740 172 h20" stroke="#f97316" stroke-width="1.6" fill="none"/>
    <path d="M766 172 l-7 -4 v8 z" fill="#f97316"/>
    <path d="M781 171 v-2.1 a3 3 0 0 1 6 0v2.1 M779.8 171h8.4v6.5h-8.4z" fill="none" stroke="#f97316" stroke-width="1.2" stroke-linejoin="round"/>
    <text x="796" y="177.5" font-size="11.5" font-weight="600" fill="#6b7280">DePIN messaging</text>
  </g>

  <!-- Request path panel -->
  <rect x="60" y="222" width="880" height="220" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="84" y="254" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6b7280">REQUEST PATH</text>

  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <!-- Web application -->
    <rect x="84" y="280" width="190" height="82" rx="12" fill="#f4f4f6" stroke="#e5e7eb"/>
    <rect x="84" y="280" width="190" height="22" rx="11" fill="#ffffff"/>
    <circle cx="102" cy="291" r="3" fill="#f97316"/>
    <circle cx="112" cy="291" r="3" fill="#fed7aa"/>
    <circle cx="122" cy="291" r="3" fill="#e5e7eb"/>
    <text x="179" y="333" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">web application</text>
    <text x="179" y="350" text-anchor="middle" font-size="11.5" fill="#6b7280">browser or server</text>

    <!-- HTTP connector + readable badge -->
    <path d="M286 321 H354" stroke="#f97316" stroke-width="2.5" fill="none"/>
    <path d="M366 321 l-13 -8 v16 z" fill="#f97316"/>
    <rect x="299" y="286" width="54" height="21" rx="10.5" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="326" y="300.5" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing=".7" fill="#ea6c10">HTTP</text>

    <!-- Proxy, focal point -->
    <rect x="376" y="273" width="248" height="97" rx="13" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <rect x="397" y="291" width="36" height="36" rx="10" fill="#f97316"/>
    <path d="M407 309 h16 M415 301 v16" stroke="#fff7ed" stroke-width="2.2" stroke-linecap="round"/>
    <text x="450" y="310" font-size="21" font-weight="700" fill="#111827">RPC proxy</text>
    <rect x="449" y="323" width="103" height="25" rx="6" fill="#ffffff" stroke="#fed7aa"/>
    <text x="500.5" y="340.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#ea6c10">POST /rpc</text>

    <!-- RPC connector + readable badge -->
    <path d="M636 321 H704" stroke="#f97316" stroke-width="2.5" fill="none"/>
    <path d="M716 321 l-13 -8 v16 z" fill="#f97316"/>
    <rect x="649" y="286" width="50" height="21" rx="10.5" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="674" y="300.5" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing=".7" fill="#ea6c10">RPC</text>

    <!-- Node -->
    <rect x="726" y="280" width="190" height="82" rx="12" fill="#f4f4f6" stroke="#e5e7eb"/>
    <circle cx="759" cy="321" r="13" fill="#ffffff" stroke="#f97316" stroke-width="1.7"/>
    <circle cx="759" cy="321" r="5" fill="#f97316"/>
    <text x="833" y="318" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#111827">neuraid</text>
    <text x="833" y="340" text-anchor="middle" font-size="11.5" fill="#6b7280">your full node</text>
  </g>

  <!-- DePIN callout: intentionally separate from the transport flow -->
  <rect x="60" y="458" width="880" height="1" fill="#e5e7eb"/>
  <rect x="260" y="458" width="480" height="28" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <g transform="translate(281 464)">
    <path d="M3 7 V4.5 a4 4 0 0 1 8 0 V7" fill="none" stroke="#f97316" stroke-width="1.6"/>
    <rect x="0" y="7" width="14" height="10" rx="2.2" fill="#f97316"/>
    <circle cx="7" cy="12" r="1.5" fill="#fff7ed"/>
  </g>
  <text x="305" y="477.5" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ea6c10">DePIN</text>
  <text x="355" y="477.5" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280">client-encrypted messages travel through the same RPC gateway</text>
</svg>
