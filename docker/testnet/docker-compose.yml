name: neurai-wallet-rpc-testnet

services:
  neuraid:
    build:
      context: ../node
      dockerfile: Dockerfile
      args:
        # Testnet deliberately uses the branch that implements DePIN messaging.
        BRANCH: DePIN-Test
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      # ── Network ──────────────────────────────────────────────────────────
      NEURAI_TESTNET: "1"
      # NEURAI_LISTEN: 1 to accept inbound P2P connections
      NEURAI_LISTEN: "0"
      NEURAI_REST: "1"

      # ── RPC ──────────────────────────────────────────────────────────────
      # RPC user/pass/port come from .env (copy .env.example) so the proxy
      # connects with the exact same values — change them once, both follow.
      NEURAI_RPC_USER: "${NODE_RPC_USER:-neurai}"
      NEURAI_RPC_PASSWORD: "${NODE_RPC_PASSWORD:-neuraipassword12}"
      NEURAI_RPC_ALLOW_IP: "0.0.0.0/0"
      NEURAI_RPC_PORT: "${NODE_RPC_PORT:-19101}"
      NEURAI_RPC_TIMEOUT: "240"
      NEURAI_RPC_WORKQUEUE: "64"
      NEURAI_RPC_THREADS: "8"

      # The DePIN service derives its pool key from the node's wallet, so the
      # wallet stays enabled here. Keep it dedicated and empty of funds: the
      # key is hot for as long as the node serves.
      NEURAI_DISABLE_WALLET: "0"

      NEURAI_TXINDEX: "1"
      NEURAI_ASSETINDEX: "1"
      NEURAI_ADDRESSINDEX: "1"
      NEURAI_TIMESTAMPINDEX: "1"
      NEURAI_SPENTINDEX: "1"
      NEURAI_PUBKEYINDEX: "1"

      NEURAI_ZMQ_ENABLED: "1"
      NEURAI_ZMQ_BIND: "tcp://0.0.0.0:28332"

      # DePIN protocol 2: served on the node's RPC port only (no 19002); the
      # pool key comes from the node's wallet and clients pin it on first use.
      NEURAI_DEPIN_ENABLED: "1"
      NEURAI_DEPIN_TOKEN: "&DEPINTESTING"
      # Per address and minute, enforced by the node (challenges + submits).
      NEURAI_DEPIN_RATE_LIMIT: "20"
      NEURAI_DEPIN_MAX_MESSAGE_SIZE: "1024"
      NEURAI_DEPIN_MESSAGE_EXPIRY: "168"
      NEURAI_DEPIN_MAX_POOL_SIZE: "100"

      # ── Data ─────────────────────────────────────────────────────────────
      NEURAI_DATADIR: "/data"

    volumes:
      - neurai_data_testnet:/data

    networks:
      - neurai_net_testnet

    healthcheck:
      test: ["CMD", "neurai-cli", "-datadir=/data", "getblockchaininfo"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  rpc-proxy:
    build:
      context: ../..
      dockerfile: docker/proxy-rpc/Dockerfile
    image: neurai-rpc-proxy:local
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      # ── Proxy HTTP server ────────────────────────────────────────────────
      PROXY_PORT: "${PROXY_PORT:-19222}"
      PROXY_CONCURRENCY: "4"
      PROXY_ENVIRONMENT: "Neurai Testnet"
      PROXY_HEADING: "Neurai RPC Proxy (testnet)"
      # Public URL shown on the web page and returned by GET /settings. From
      # .env; empty = derive it from the request host.
      PROXY_ENDPOINT: "${PROXY_ENDPOINT-https://rpc-testnet.neurai.org/rpc}"

      NEURAI_NODE_NAME: "neuraid-testnet"
      # Upstream URL is built from the SAME NODE_RPC_PORT the node uses, so a
      # port change in .env updates both sides automatically.
      NEURAI_NODE_URL: "http://neuraid:${NODE_RPC_PORT:-19101}"
      NEURAI_RPC_USER: "${NODE_RPC_USER:-neurai}"
      NEURAI_RPC_PASSWORD: "${NODE_RPC_PASSWORD:-neuraipassword12}"
      # Per origin IP and minute for depin* methods; over it, the IP is
      # blocked for PROXY_DEPIN_BAN_MINUTES. Set PROXY_TRUST_PROXY=true only
      # when a trusted reverse proxy in front sets X-Forwarded-For.
      PROXY_DEPIN_RATE_LIMIT: "60"
      PROXY_DEPIN_BAN_MINUTES: "60"
      PROXY_TRUST_PROXY: "false"

    ports:
      # PROXY_BIND + PROXY_PORT from .env. Host and container port are the same
      # single value; PROXY_BIND picks loopback (secure) vs 0.0.0.0 (public).
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-19222}:${PROXY_PORT:-19222}"

    networks:
      - neurai_net_testnet

    depends_on:
      neuraid:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${PROXY_PORT:-19222}/settings || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  neurai_data_testnet:
    driver: local

networks:
  neurai_net_testnet:
    driver: bridge
